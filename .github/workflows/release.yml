name: Release

# Releases follow the version in config.py: whenever main lands with a VERSION
# that has no tag yet, that version is built, tagged and published. Merges that
# do not change the version do nothing.
on:
  push:
    branches: [dev-release-packages]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  APP_NAME: OpenGS-MapTool

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      release-needed: ${{ steps.check.outputs.release-needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and compare against existing tags
        id: check
        run: |
          version=$(python - <<'PY'
          import pathlib, re, sys

          def find(path, pattern):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              match = re.search(pattern, text, re.M)
              if not match:
                  sys.exit(f"Could not find a version in {path}")
              return match.group(1)

          config = find("opengs_maptool/config.py", r'^VERSION\s*=\s*"([^"]+)"')
          project = find("pyproject.toml", r'^version\s*=\s*"([^"]+)"')
          if config != project:
              sys.exit(
                  f"Version mismatch: config.py says {config!r}, "
                  f"pyproject.toml says {project!r}. Sync them before releasing."
              )

          print(config)
          PY
          )

          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "release-needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already exists - nothing to release."
          else
            echo "release-needed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is new - building a release."
          fi

  build-linux:
    name: Build Linux
    needs: check-version
    if: needs.check-version.outputs.release-needed == 'true'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build (Linux)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --collect-all qtawesome
          --exclude-module tkinter --exclude-module tkinterdnd2 --exclude-module pytest
          opengs_maptool/main.py

      - name: Stage release files
        shell: bash
        run: |
          stage="staging/${{ env.APP_NAME }}"
          mkdir -p "$stage"

          cp "dist/${{ env.APP_NAME }}" "$stage/"
          cp -R examples/input "$stage/examples"
          cp README.md LICENSE "$stage/"

          ls -laR "$stage" | head -30

      - name: Package (Linux)
        run: |
          tar -czf "OpenGS-MapTool-linux-x86_64.tar.gz" \
            -C staging "${{ env.APP_NAME }}"

      - name: Check the asset was produced
        shell: bash
        run: |
          test -f "OpenGS-MapTool-linux-x86_64.tar.gz" || {
            echo "::error::OpenGS-MapTool-linux-x86_64.tar.gz was not built"
            exit 1
          }

          echo "Built OpenGS-MapTool-linux-x86_64.tar.gz ($(du -h "OpenGS-MapTool-linux-x86_64.tar.gz" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: OpenGS-MapTool-linux-x86_64.tar.gz
          if-no-files-found: error

      # The Flatpak job needs the PyInstaller executable and example files.
      - name: Upload Linux executable for Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-input
          path: staging/${{ env.APP_NAME }}
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: check-version
    if: needs.check-version.outputs.release-needed == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build (Windows)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --icon ogs-mt-icon-master.ico
          --collect-all qtawesome
          --exclude-module tkinter --exclude-module tkinterdnd2 --exclude-module pytest
          opengs_maptool/main.py

      - name: Stage release files
        shell: bash
        run: |
          stage="staging/${{ env.APP_NAME }}"
          mkdir -p "$stage"

          cp "dist/${{ env.APP_NAME }}.exe" "$stage/"
          cp -R examples/input "$stage/examples"
          cp README.md LICENSE "$stage/"

          ls -laR "$stage" | head -30

      - name: Package (Windows)
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "staging/${{ env.APP_NAME }}" `
            -DestinationPath "OpenGS-MapTool-windows-x86_64.zip"

      - name: Check the asset was produced
        shell: bash
        run: |
          test -f "OpenGS-MapTool-windows-x86_64.zip" || {
            echo "::error::OpenGS-MapTool-windows-x86_64.zip was not built"
            exit 1
          }

          echo "Built OpenGS-MapTool-windows-x86_64.zip ($(du -h "OpenGS-MapTool-windows-x86_64.zip" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: OpenGS-MapTool-windows-x86_64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: check-version
    if: needs.check-version.outputs.release-needed == 'true'
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build (macOS)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --icon ogs-mt-icon-master.icns
          --collect-all qtawesome
          --exclude-module tkinter --exclude-module tkinterdnd2 --exclude-module pytest
          opengs_maptool/main.py

      - name: Stage release files
        shell: bash
        run: |
          stage="staging/${{ env.APP_NAME }}"
          mkdir -p "$stage"

          ditto "dist/${{ env.APP_NAME }}.app" "$stage/${{ env.APP_NAME }}.app"
          cp -R examples/input "$stage/examples"
          cp README.md LICENSE "$stage/"

          ls -laR "$stage" | head -30

      - name: Package (macOS)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "staging/${{ env.APP_NAME }}" \
            "OpenGS-MapTool-macos-arm64.zip"

      - name: Check the asset was produced
        shell: bash
        run: |
          test -f "OpenGS-MapTool-macos-arm64.zip" || {
            echo "::error::OpenGS-MapTool-macos-arm64.zip was not built"
            exit 1
          }

          echo "Built OpenGS-MapTool-macos-arm64.zip ($(du -h "OpenGS-MapTool-macos-arm64.zip" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: OpenGS-MapTool-macos-arm64.zip
          if-no-files-found: error

  build-flatpak:
    name: Build Flatpak
    needs: build-linux
    if: needs.build-linux.result == 'success'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux executable
        uses: actions/download-artifact@v4
        with:
          name: flatpak-input
          path: packaging/flatpak/build-input

      - name: Prepare Flatpak source directory
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloaded Flatpak input:"
          find packaging/flatpak/build-input -maxdepth 4 -type f -print

          executable="$(find packaging/flatpak/build-input -type f -name "${{ env.APP_NAME }}" -print -quit)"

          if [ -z "$executable" ]; then
            echo "::error::Could not find ${{ env.APP_NAME }} in downloaded Flatpak input"
            exit 1
          fi

          examples_dir="$(dirname "$executable")/examples"

          if [ ! -d "$examples_dir" ]; then
            echo "::error::Could not find examples directory: $examples_dir"
            exit 1
          fi

          mkdir -p packaging/flatpak/source/examples

          cp "$executable" \
            "packaging/flatpak/source/${{ env.APP_NAME }}"

          cp -a "$examples_dir/." \
            packaging/flatpak/source/examples/

          cp packaging/flatpak/com.opengs.MapTool.desktop \
            packaging/flatpak/source/

          cp packaging/flatpak/com.opengs.MapTool.png \
            packaging/flatpak/source/

          cp packaging/flatpak/com.opengs.MapTool.metainfo.xml \
            packaging/flatpak/source/

          chmod +x \
            "packaging/flatpak/source/${{ env.APP_NAME }}"

          echo "Prepared Flatpak source:"
          ls -laR packaging/flatpak/source

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: OpenGS-MapTool-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/com.opengs.MapTool.yml
          arch: x86_64
          upload-artifact: false

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-flatpak
          path: OpenGS-MapTool-linux-x86_64.flatpak
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - check-version
      - build-windows
      - build-linux
      - build-macos
      - build-flatpak

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: assets
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          ls -lh assets

          gh release create "$TAG" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            assets/*
