name: Release

# Releases follow the version in config.py: whenever main lands with a VERSION
# that has no tag yet, that version is built, tagged and published. Merges that
# do not change the version do nothing.
on:
  push:
    branches: [dev-release-packages]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  APP_NAME: OpenGS-MapTool

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      release-needed: ${{ steps.check.outputs.release-needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and compare against existing tags
        id: check
        run: |
          version=$(python - <<'PY'
          import pathlib, re, sys

          def find(path, pattern):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              match = re.search(pattern, text, re.M)
              if not match:
                  sys.exit(f"Could not find a version in {path}")
              return match.group(1)

          config = find("opengs_maptool/config.py", r'^VERSION\s*=\s*"([^"]+)"')
          project = find("pyproject.toml", r'^version\s*=\s*"([^"]+)"')
          if config != project:
              sys.exit(
                  f"Version mismatch: config.py says {config!r}, "
                  f"pyproject.toml says {project!r}. Sync them before releasing."
              )

          print(config)
          PY
          )

          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "release-needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already exists - nothing to release."
          else
            echo "release-needed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is new - building a release."
          fi

  build-linux:
    name: Build Linux
    needs: check-version
    if: needs.check-version.outputs.release-needed == 'true'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build (Linux)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --collect-all qtawesome
          --exclude-module tkinter --exclude-module tkinterdnd2 --exclude-module pytest
          opengs_maptool/main.py

      - name: Stage release files
        shell: bash
        run: |
          stage="staging/${{ env.APP_NAME }}"
          mkdir -p "$stage"

          cp "dist/${{ env.APP_NAME }}" "$stage/"
          cp -R examples/input "$stage/examples"
          cp README.md LICENSE "$stage/"

          ls -laR "$stage" | head -30

      - name: Install Debian build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev desktop-file-utils

      - name: Prepare Debian Package Structure
        shell: bash
        run: |
          set -euo pipefail

          pkg_dir="$PWD/deb-build"
          rm -rf "$pkg_dir"

          # Define Linux directory structure
          mkdir -p "$pkg_dir/DEBIAN"
          mkdir -p "$pkg_dir/usr/bin"
          mkdir -p "$pkg_dir/usr/share/applications"
          mkdir -p "$pkg_dir/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$pkg_dir/usr/share/${{ env.APP_NAME }}"

          # Copy binary and supplementary files
          cp "staging/${{ env.APP_NAME }}/${{ env.APP_NAME }}" "$pkg_dir/usr/bin/opengs-maptool"
          chmod +x "$pkg_dir/usr/bin/opengs-maptool"

          cp -a "staging/${{ env.APP_NAME }}/examples" "$pkg_dir/usr/share/${{ env.APP_NAME }}/"
          cp "README.md" "LICENSE" "$pkg_dir/usr/share/${{ env.APP_NAME }}/"

          # Desktop shortcut & icon integration
          cp packaging/flatpak/com.opengs.MapTool.desktop "$pkg_dir/usr/share/applications/"
          cp packaging/flatpak/com.opengs.MapTool.png "$pkg_dir/usr/share/icons/hicolor/256x256/apps/"

          # Ensure metadata passes validation
          desktop-file-validate "$pkg_dir/usr/share/applications/com.opengs.MapTool.desktop"

          # Generate DEBIAN/control
          ver="${{ needs.check-version.outputs.version }}"
          cat <<EOF > "$pkg_dir/DEBIAN/control"
          Package: opengs-maptool
          Version: ${ver}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: OpenGS Team <info@opengs.org>
          Depends: libegl1, libgl1, libdbus-1-3, libxkbcommon-x11-0, libxcb-cursor0
          Description: OpenGS MapTool application
           Map editing and processing tool built with Python and Qt.
          EOF

      - name: Build Debian Package
        shell: bash
        run: |
          set -euo pipefail

          ver="${{ needs.check-version.outputs.version }}"
          deb_filename="opengs-maptool_${ver}_amd64.deb"

          dpkg-deb --build --root-owner-group deb-build "$deb_filename"

          if [ ! -f "$deb_filename" ]; then
            echo "::error::dpkg-deb failed to produce $deb_filename"
            exit 1
          fi

          echo "Successfully created $deb_filename"

      - name: Validate .deb Package
        shell: bash
        run: |
          set -euo pipefail

          ver="${{ needs.check-version.outputs.version }}"
          deb_filename="opengs-maptool_${ver}_amd64.deb"

          # Inspect contents and info
          dpkg-deb --info "$deb_filename"
          dpkg-deb --contents "$deb_filename"

          # Unpack and verify launch capability
          mkdir -p deb-extract
          dpkg-deb -x "$deb_filename" deb-extract

          test -x deb-extract/usr/bin/opengs-maptool
          test -f deb-extract/usr/share/applications/com.opengs.MapTool.desktop
          test -f deb-extract/usr/share/icons/hicolor/256x256/apps/com.opengs.MapTool.png

          # Smoke test application execution in headless mode
          set +e
          QT_QPA_PLATFORM=offscreen timeout 10s \
            "deb-extract/usr/bin/opengs-maptool" >/tmp/opengs-maptool.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "::error::Packaged application failed to launch (exit code $status)"
            cat /tmp/opengs-maptool.log
            exit "$status"
          fi

          echo "Debian package validation passed."

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: opengs-maptool_*_amd64.deb
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: check-version
    if: needs.check-version.outputs.release-needed == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build (Windows)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --icon ogs-mt-icon-master.ico
          --collect-all qtawesome
          --exclude-module tkinter --exclude-module tkinterdnd2 --exclude-module pytest
          opengs_maptool/main.py

      - name: Stage release files
        shell: bash
        run: |
          stage="staging/${{ env.APP_NAME }}"
          mkdir -p "$stage"

          cp "dist/${{ env.APP_NAME }}.exe" "$stage/"
          cp -R examples/input "$stage/examples"
          cp README.md LICENSE "$stage/"

          ls -laR "$stage" | head -30

      - name: Package (Windows)
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "staging/${{ env.APP_NAME }}" `
            -DestinationPath "OpenGS-MapTool-windows-x86_64.zip"

      - name: Check the asset was produced
        shell: bash
        run: |
          test -f "OpenGS-MapTool-windows-x86_64.zip" || {
            echo "::error::OpenGS-MapTool-windows-x86_64.zip was not built"
            exit 1
          }

          echo "Built OpenGS-MapTool-windows-x86_64.zip ($(du -h "OpenGS-MapTool-windows-x86_64.zip" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: OpenGS-MapTool-windows-x86_64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: check-version
    if: needs.check-version.outputs.release-needed == 'true'
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build (macOS)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --icon ogs-mt-icon-master.icns
          --collect-all qtawesome
          --exclude-module tkinter --exclude-module tkinterdnd2 --exclude-module pytest
          opengs_maptool/main.py

      - name: Stage release files
        shell: bash
        run: |
          stage="staging/${{ env.APP_NAME }}"
          mkdir -p "$stage"

          ditto "dist/${{ env.APP_NAME }}.app" "$stage/${{ env.APP_NAME }}.app"
          cp -R examples/input "$stage/examples"
          cp README.md LICENSE "$stage/"

          ls -laR "$stage" | head -30

      - name: Package (macOS)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "staging/${{ env.APP_NAME }}" \
            "OpenGS-MapTool-macos-arm64.zip"

      - name: Check the asset was produced
        shell: bash
        run: |
          test -f "OpenGS-MapTool-macos-arm64.zip" || {
            echo "::error::OpenGS-MapTool-macos-arm64.zip was not built"
            exit 1
          }

          echo "Built OpenGS-MapTool-macos-arm64.zip ($(du -h "OpenGS-MapTool-macos-arm64.zip" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: OpenGS-MapTool-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - check-version
      - build-windows
      - build-linux
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: assets
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          ls -lh assets

          gh release create "$TAG" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            assets/*
