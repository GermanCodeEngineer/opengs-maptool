name: Release

# Releases follow the version in config.py: whenever main lands with a VERSION
# that has no tag yet, that version is built, tagged and published. Merges that
# do not change the version do nothing.
on:
  push:
    branches: [dev-release-packages]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  APP_NAME: OpenGS-MapTool

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      release-needed: ${{ steps.check.outputs.release-needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and compare against existing tags
        id: check
        run: |
          version=$(python - <<'PY'
          import pathlib, re, sys

          def find(path, pattern):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              match = re.search(pattern, text, re.M)
              if not match:
                  sys.exit(f"Could not find a version in {path}")
              return match.group(1)

          config = find("opengs_maptool/config.py", r'^VERSION\s*=\s*"([^"]+)"')
          project = find("pyproject.toml", r'^version\s*=\s*"([^"]+)"')
          if config != project:
              sys.exit(
                  f"Version mismatch: config.py says {config!r}, "
                  f"pyproject.toml says {project!r}. Sync them before releasing."
              )

          print(config)
          PY
          )

          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "release-needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already exists - nothing to release."
          else
            echo "release-needed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is new - building a release."
          fi

  build-linux:
    name: Build Linux
    needs: check-version
    if: needs.check-version.outputs.release-needed == 'true'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build (Linux)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --collect-all qtawesome
          --exclude-module tkinter --exclude-module tkinterdnd2 --exclude-module pytest
          opengs_maptool/main.py

      - name: Stage release files
        shell: bash
        run: |
          stage="staging/${{ env.APP_NAME }}"
          mkdir -p "$stage"

          cp "dist/${{ env.APP_NAME }}" "$stage/"
          cp -R examples/input "$stage/examples"
          cp README.md LICENSE "$stage/"

          ls -laR "$stage" | head -30

      - name: Install AppImage build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils squashfs-tools file

      - name: Download linuxdeploy
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --version

      - name: Prepare AppImage
        shell: bash
        run: |
          set -euo pipefail

          appdir="$PWD/AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir"

          # The existing desktop file and icon are also used by the previous
          # Flatpak packaging, so keep one source of truth for application
          # metadata. # GCE-TODO: update comments
          test -f packaging/flatpak/com.opengs.MapTool.desktop
          test -f packaging/flatpak/com.opengs.MapTool.png

          desktop-file-validate packaging/flatpak/com.opengs.MapTool.desktop

          # Keep the examples next to the application payload. This preserves
          # the same relative layout as the existing tarball/staging package.
          mkdir -p "$appdir/usr/bin"
          cp "staging/${{ env.APP_NAME }}/${{ env.APP_NAME }}" \
             "$appdir/usr/bin/${{ env.APP_NAME }}"
          cp -a "staging/${{ env.APP_NAME }}/examples" \
             "$appdir/usr/bin/examples"

          # AppImage requires a desktop file and icon in the AppDir.
          cp packaging/flatpak/com.opengs.MapTool.desktop "$appdir/"
          cp packaging/flatpak/com.opengs.MapTool.png "$appdir/"

          chmod +x "$appdir/usr/bin/${{ env.APP_NAME }}"

          echo "=== AppDir ==="
          find "$appdir" -maxdepth 5 -type f -printf '%M %p\n' | sort

      - name: Build AppImage
        shell: bash
        env:
          NO_STRIP: "1"
        run: |
          set -euo pipefail

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable "AppDir/usr/bin/${{ env.APP_NAME }}" \
            --desktop-file "AppDir/com.opengs.MapTool.desktop" \
            --icon-file "AppDir/com.opengs.MapTool.png" \
            --output appimage

          generated="$(find . -maxdepth 1 -type f -name '*.AppImage' \
            ! -name 'linuxdeploy-x86_64.AppImage' -print -quit)"

          if [ -z "$generated" ]; then
            echo "::error::linuxdeploy did not produce an AppImage"
            exit 1
          fi

          mv "$generated" "OpenGS-MapTool-x86_64.AppImage"
          chmod +x "OpenGS-MapTool-x86_64.AppImage"

      - name: Validate AppImage
        shell: bash
        run: |
          set -euo pipefail

          image="OpenGS-MapTool-x86_64.AppImage"

          test -s "$image"
          file "$image"
          ./"$image" --appimage-version

          rm -rf appimage-check
          ./"$image" --appimage-extract >/dev/null

          test -x squashfs-root/AppRun
          test -f squashfs-root/com.opengs.MapTool.desktop
          test -f squashfs-root/com.opengs.MapTool.png
          test -x "squashfs-root/usr/bin/${{ env.APP_NAME }}"

          desktop-file-validate squashfs-root/com.opengs.MapTool.desktop

          echo "=== Extracted AppImage contents ==="
          find squashfs-root -maxdepth 5 -type f -printf '%M %p\n' | sort | head -100

          # Smoke-test the packaged application without requiring a graphical
          # desktop. A GUI application is expected to remain alive, so timeout
          # code 124 is considered a successful launch.
          set +e
          QT_QPA_PLATFORM=offscreen timeout 10s \
            "squashfs-root/AppRun" >/tmp/opengs-maptool.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "::error::Packaged application failed to launch (exit code $status)"
            cat /tmp/opengs-maptool.log
            exit "$status"
          fi

          echo "AppImage validation passed."

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: OpenGS-MapTool-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: check-version
    if: needs.check-version.outputs.release-needed == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build (Windows)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --icon ogs-mt-icon-master.ico
          --collect-all qtawesome
          --exclude-module tkinter --exclude-module tkinterdnd2 --exclude-module pytest
          opengs_maptool/main.py

      - name: Stage release files
        shell: bash
        run: |
          stage="staging/${{ env.APP_NAME }}"
          mkdir -p "$stage"

          cp "dist/${{ env.APP_NAME }}.exe" "$stage/"
          cp -R examples/input "$stage/examples"
          cp README.md LICENSE "$stage/"

          ls -laR "$stage" | head -30

      - name: Package (Windows)
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "staging/${{ env.APP_NAME }}" `
            -DestinationPath "OpenGS-MapTool-windows-x86_64.zip"

      - name: Check the asset was produced
        shell: bash
        run: |
          test -f "OpenGS-MapTool-windows-x86_64.zip" || {
            echo "::error::OpenGS-MapTool-windows-x86_64.zip was not built"
            exit 1
          }

          echo "Built OpenGS-MapTool-windows-x86_64.zip ($(du -h "OpenGS-MapTool-windows-x86_64.zip" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: OpenGS-MapTool-windows-x86_64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: check-version
    if: needs.check-version.outputs.release-needed == 'true'
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build (macOS)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --icon ogs-mt-icon-master.icns
          --collect-all qtawesome
          --exclude-module tkinter --exclude-module tkinterdnd2 --exclude-module pytest
          opengs_maptool/main.py

      - name: Stage release files
        shell: bash
        run: |
          stage="staging/${{ env.APP_NAME }}"
          mkdir -p "$stage"

          ditto "dist/${{ env.APP_NAME }}.app" "$stage/${{ env.APP_NAME }}.app"
          cp -R examples/input "$stage/examples"
          cp README.md LICENSE "$stage/"

          ls -laR "$stage" | head -30

      - name: Package (macOS)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "staging/${{ env.APP_NAME }}" \
            "OpenGS-MapTool-macos-arm64.zip"

      - name: Check the asset was produced
        shell: bash
        run: |
          test -f "OpenGS-MapTool-macos-arm64.zip" || {
            echo "::error::OpenGS-MapTool-macos-arm64.zip was not built"
            exit 1
          }

          echo "Built OpenGS-MapTool-macos-arm64.zip ($(du -h "OpenGS-MapTool-macos-arm64.zip" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: OpenGS-MapTool-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - check-version
      - build-windows
      - build-linux
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: assets
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          ls -lh assets

          gh release create "$TAG" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            assets/*
