app-id: com.example.OpenGSMapTool

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: OpenGS-MapTool

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: opengs-maptool
    buildsystem: simple

    build-commands:
      - install -Dm755 OpenGS-MapTool /app/bin/OpenGS-MapTool

      - install -Dm644 com.example.OpenGSMapTool.desktop \
          /app/share/applications/com.example.OpenGSMapTool.desktop

      - install -Dm644 com.example.OpenGSMapTool.svg \
          /app/share/icons/hicolor/scalable/apps/com.example.OpenGSMapTool.svg

      - install -Dm644 com.example.OpenGSMapTool.metainfo.xml \
          /app/share/metainfo/com.example.OpenGSMapTool.metainfo.xml

      - mkdir -p /app/share/opengs-maptool/examples
      - cp -a examples/input/. /app/share/opengs-maptool/examples/

    sources:
      - type: dir
        path: .
